# Mémoire du démon Gradle.
# 4 Go de heap suffisent largement pour ce projet, y compris pour R8 (la
# minification du buildType release). L'ancienne valeur (-Xmx8G avec
# 4 Go de metaspace) réservait plus de RAM que n'en ont beaucoup de postes
# et la quasi-totalité des agents de CI : le démon Gradle échouait au
# démarrage ailleurs que sur le poste d'origine.
# Si un jour R8 lève un OutOfMemoryError, remonter à -Xmx6G AVANT d'envisager 8.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.jvm.target.validation.mode=warning
# android.bundle.enableUncompressedNativeLibs=false
# This builtInKotlin flag was added automatically by Flutter migrator
# Kept false: Flutter 3.44's Gradle plugin still applies KGP probes to plugins
# without KGP, which conflicts with AGP 9 built-in Kotlin (android.builtInKotlin=true
# breaks the build with the current plugin set). The vendored plugins in
# third_party/ no longer apply KGP in their build files.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# NE PAS réintroduire `org.gradle.java.home` en dur.
# Un chemin absolu vers un JDK local (ex. C:\Program Files\Java\jdk-17) casse
# le build sur tout autre poste et sur la CI. Gradle résout le JDK via, dans
# l'ordre : JAVA_HOME, puis le JDK configuré pour Flutter
# (`flutter config --jdk-dir="chemin/vers/jdk"`).
# Prérequis du projet : JDK 17 (cf. compileOptions dans app/build.gradle.kts).
# Vérification : `flutter doctor -v` doit afficher un « Java version 17.x ».
